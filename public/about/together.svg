<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Vanessa and Luna together illustration">
  <!-- Original illustration of founder and cat together -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF6EC"/>
      <stop offset="100%" stop-color("#E8D9C8)"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="#FDF6EC"/>

  <!-- Signal arcs behind -->
  <g stroke="#D4A017" strokeWidth="3" strokeLinecap="round" fill="none" opacity="0.5">
    <path d="M250 80 A120 120 0 0 1 370 80" />
    <path d="M250 95 A105 105 0 0 1 355 95" />
    <path d="M250 110 A90 90 0 0 1 340 110" />
  </g>

  <!-- Vanessa (left side, abstracted) -->
  <g transform="translate(120, 120)">
    <path d="M-20 60 Q-20 0 10 0 Q40 0 40 60 Q40 120 10 140 Q-20 120 -20 60 Z" fill="#F3E3C6" stroke="#5E2A52" strokeWidth="2"/>
    <path d="M-20 60 Q-40 120 10 140 Q60 120 40 60 Q40 0 10 0 Q-20 0 -20 60 Z" fill="#5E2A52" opacity="0.4"/>
    <circle cx="0" cy="45" r="3" fill="#3B1F36"/>
    <circle cx="30" cy="45" r="3" fill="#3B1F36"/>
    <path d="M5 65 Q20 75 35 65" stroke="#D4A017" strokeWidth="2" strokeLinecap="round" fill="none"/>
    <path d="M10 120 Q40 150 70 120 Q70 140 40 160 Q10 140 10 120 Z" fill="#D4A017"/>
    <path d="M-10 130 Q40 170 90 130 Q90 180 40 190 Q-10 180 -10 130 Z" fill="#5E2A52" opacity="0.8"/>
  </g>

  <!-- Luna (right side) -->
  <g transform="translate(300, 140)">
    <ellipse cx="0" cy="20" rx="45" ry="35" fill="#5E2A52"/>
    <circle cx="0" cy="-10" r="35" fill="#5E2A52"/>
    <path d="M-30 -20 L-40 -45 L-15 -30 Z" fill="#3B1F36" stroke="#D4A017" strokeWidth="2"/>
    <path d="M30 -20 L40 -45 L15 -30 Z" fill="#3B1F36" stroke="#D4A017" strokeWidth="2"/>
    <circle cx="-15" cy="-15" r="4" fill="#FDF6EC"/>
    <circle cx="15" cy="-15" r="4" fill="#FDF6EC"/>
    <circle cx="-15" cy="-15" r="1.5" fill="#3B1F36"/>
    <circle cx="15" cy="-15" r="1.5" fill="#3B1F36"/>
    <circle cx="0" cy="0" r="3" fill="#D4A017"/>
    <path d="M-8 5 Q0 10 8 5" stroke="#3B1F36" strokeWidth="1.5" strokeLinecap="round" fill="none"/>
    <ellipse cx="0" cy="25" rx="30" ry="6" fill="none" stroke="#D4A017" strokeWidth="2.5"/>
    <circle cx="0" cy="34" r="4" fill="#FDF6EC" stroke="#5E2A52" strokeWidth="1.5"/>
  </g>

  <!-- Heart between them -->
  <path d="M210 100 Q205 95 200 100 Q195 95 190 100 Q185 110 200 125 Q215 110 210 100 Z" fill="#D4A017" opacity="0.9"/>

  <text x="250" y="370" font-family="serif" font-size="16" fill="#5E2A52" text-anchor="middle" font-weight="bold">Vanessa &amp; Luna</text>
  <text x="250" y="390" font-family="sans-serif" font-size="11" fill="#3B1F36" text-anchor="middle">Founder and her inspiration</text>
</svg>
